const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const DOM={cloud:"Cloud concepts",arch:"Azure architecture and services",gov:"Azure management and governance"};

/* ---------- Content (original) ---------- */

models:{n:"Cloud models and service types",d:"cloud",k:"public private hybrid iaas paas saas shared responsibility service model",
 l:"Cloud computing means renting IT resources over the internet. Public cloud is shared infrastructure run by a provider, private cloud is dedicated to one organisation, and hybrid mixes both. IaaS rents raw servers, PaaS gives you a platform to run code, and SaaS is finished software. Protecting your data and accounts is always your job.",

const Q=[
["models",0,"A company keeps customer records on its own servers but uses Azure for extra web capacity during sales. Which cloud model is this?",["Public cloud only","Private cloud only","Hybrid cloud","Community cloud"],2,"Hybrid cloud combines on-premises or private resources with public cloud."],

["regions",0,"What is an Azure region?",["A single server rack","A set of datacenters in a latency-defined area, linked by a fast network","A billing country","A type of subscription"],1,"A region is a geographic area containing one or more datacenters."],
["regions",0,"Which feature puts your app in physically separate datacenters within one region to survive a datacenter failure?",["Resource locks","Availability Zones","Tags","Management groups"],1,"Availability Zones are separate datacenter locations inside a region."],

["core",0,"Which service runs small pieces of code in response to events without you managing servers?",["Azure Functions","Azure Virtual Machines","Azure Blob Storage","Azure DNS"],0,"Azure Functions is event-driven, serverless compute."],
["core",0,"Which storage option suits large amounts of unstructured data such as photos and videos?",["Azure Blob Storage","Azure SQL Database","Azure Virtual Network","Azure Key Vault"],0,"Blob Storage is built for unstructured objects like images, video and backups."],
["core",1,"A legacy app needs full control of the operating system. Which service fits best?",["Azure Virtual Machines","Azure Functions","A SaaS email product","Azure DNS"],0,"Virtual Machines (IaaS) give you control of the OS and what runs on it."],
["cost",0,"Which tool estimates the monthly cost of Azure services before you deploy them?",["Azure Monitor","Pricing calculator","Azure Policy","Service Health"],1,"The Pricing Calculator builds a cost estimate for planned resources."],

["cost",1,"Why do tags help with cost tracking?",["They label resources, for example by department, so costs can be grouped","They make tagged resources free","They encrypt resources","They move resources to cheaper regions"],0,"Tags are name/value labels. Cost reports can be filtered and grouped by them."],

["benefits",1,"Which design principle lets an app keep working when part of it fails?",["Fault tolerance","A single point of failure","Manual scaling","Larger invoices"],0,"Fault-tolerant systems continue operating despite component failures.","Fault tolerance"],

["cost",0,"Which of these can change the cost of an Azure resource?",["Its region and size","Only its name","Its tag colour","Nothing, prices are identical everywhere"],0,"Region, size, usage and pricing tier all influence what you pay.","Cost factors"],

["Hybrid cloud","SaaS","Shared responsibility","CapEx vs OpEx","Elasticity","Scalability","Azure regions","Availability Zones","Resource groups","Azure Functions","Blob Storage","Virtual Machines","Pricing calculator","TCO calculator","Tags","Azure Policy","Resource locks","Azure Monitor"].forEach((c,i)=>{Q[i][6]=c});

/* ---------- Data helpers (quiz engine, no AI involved) ---------- */
const MIN=3,GP=70,KIND={revision:"Revision practice",mastery:"Mastery check"},KIND_DONE={revision:"Revision practice complete",mastery:"Mastery check complete"};
// Records: raw = everything stored; attAll = readable records (old v1 and new v2); att = assessments only (revision practice excluded from analysis).
const raw=()=>{const a=Store.get("attempts",[]);return Array.isArray(a)?a:[]};
const readable=a=>a&&Array.isArray(a.answers)&&a.answers.length&&typeof a.score==="number"&&typeof a.total==="number"&&a.answers.every(x=>x&&T[x.t]&&typeof x.ok==="boolean");
const attAll=()=>raw().filter(readable);
const att=()=>attAll().filter(a=>a.kind!=="revision");
const unreadable=()=>raw().length-attAll().length;
const missedIds=()=>{const s=new Set();attAll().forEach(a=>a.answers.forEach(x=>{if(!x.ok)s.add(x.id)}));return s};
const seenIds=()=>{const s=new Set();attAll().forEach(a=>a.answers.forEach(x=>s.add(x.id)));return s};
function storeOk(){try{localStorage.setItem("cp:_t","1");localStorage.removeItem("cp:_t");return true}catch(e){return false}}
function badRec(r){ // strict validation before saving; returns "" when valid
  if(!["quiz","revision","mastery"].includes(r.kind))return"kind";
  if(!(r.topic==="all"||T[r.topic]))return"topic";
  if(!["all","0","1"].includes(String(r.diff)))return"difficulty";
  if(isNaN(Date.parse(r.date)))return"date";
  if(!Array.isArray(r.answers)||!r.answers.length)return"no answers";
  for(const x of r.answers){const q=Q[x.id];
    if(!q||x.t!==q[0])return"question id";
    if(typeof x.pick!=="string"||!q[3].includes(x.pick)||x.correct!==q[3][q[4]])return"answer text";
    if(x.ok!==(x.pick===x.correct))return"correctness"}
  if(r.score!==r.answers.filter(x=>x.ok).length||r.total!==r.answers.length)return"score";
  if(r.kind==="mastery"&&!(r.base&&Number.isInteger(r.base.c)&&Number.isInteger(r.base.t)&&r.base.c<=r.base.t))return"baseline";
  return"";
}
function tstats(){const s={};Object.keys(T).forEach(k=>s[k]={c:0,t:0});att().forEach(a=>a.answers.forEach(x=>{if(s[x.t]){s[x.t].t++;if(x.ok)s[x.t].c++}}));return s}
// none = no answers; few = fewer than MIN answers (insufficient data, NOT poor performance); needs = enough answers and under GP%; ok = enough answers at or above GP%
function status(k,s){s=s||tstats();const x=s[k];return x.t===0?"none":x.t<MIN?"few":x.c/x.t<GP/100?"needs":"ok"}
function weak(){const s=tstats();return Object.keys(T).filter(k=>status(k,s)==="needs").sort((a,b)=>s[a].c/s[a].t-s[b].c/s[b].t)}
function missedBy(k){const m={};att().forEach(a=>a.answers.forEach(x=>{if(x.t===k&&!x.ok&&Q[x.id]){const c=Q[x.id][6];(m[c]=m[c]||{n:0,e:Q[x.id][5]}).n++}}));return m}
const lastMastery=k=>attAll().filter(a=>a.kind==="mastery"&&a.topic===k).pop();
const pct=(c,t)=>t?Math.round(100*c/t):0;
function buildQuiz(topic,diff,count,prefer,ex){
  const missed=new Set();att().forEach(a=>a.answers.forEach(x=>{if(!x.ok)missed.add(x.id)}));
  let pool=Q.map((q,i)=>({id:i,t:q[0],df:q[1],q:q[2],o:q[3],a:q[4],e:q[5]})).filter(x=>(topic==="all"||x.t===topic)&&(diff==="all"||x.df===+diff)&&!(ex&&ex.has(x.id)));
  pool=shuf(pool);if(prefer)pool.sort((a,b)=>missed.has(b.id)-missed.has(a.id));
  return pool.slice(0,count).map(x=>{const idx=shuf(x.o.map((_,i)=>i));return{...x,o:idx.map(i=>x.o[i]),a:idx.indexOf(x.a)}});
}

/* ---------- Router & shell ---------- */
const NAV=[["overview","Overview"],["quiz","Quiz Lab"],["buddy","Study Buddy"],["coach","Weakness Coach"],["planner","Study Planner"],["progress","Progress"]];

  <main class="main" id="main"></main></div>`;

}

/* ---------- Landing ---------- */
function landing(){return `<div class="wrap"><nav class="lp"><div class="logo">☁ Cloud<span>Prep</span> AI</div><button class="btn sm" onclick="go('overview')">Get Started</button></nav>
<section class="hero"><div class="tag">Unofficial AZ-900 learning companion</div><h1>Turn your mistakes into mastery.</h1>
<p class="mut" style="font-size:1.12rem">Practise Azure Fundamentals with original questions, plain-language explanations and a revision plan built from the answers you actually give.</p>
<p style="margin-top:20px"><button class="btn" onclick="go('overview')">Get Started</button> <a href="#how" class="btn alt" style="text-decoration:none;display:inline-block" onclick="event.preventDefault();document.getElementById('how').scrollIntoView({behavior:'smooth'})">How it works</a></p></section>
<section class="grid g3">

/* ---------- Quiz Lab ---------- */
function vQuiz(){
  if(!qs){
    if(rv)return vRevLesson();
    const tp=opts.topic||"all";
    return `<h1>Quiz Lab</h1><p class="mut">Original practice questions for AZ-900 beginners.</p><div class="card" style="margin-top:14px">
    <label for="qt">Topic</label><select id="qt"><option value="all">All topics</option>${Object.keys(DOM).map(d=>`<optgroup label="${DOM[d]}">${Object.keys(T).filter(k=>T[k].d===d).map(k=>`<option value="${k}" ${k===tp?"selected":""}>${T[k].n}</option>`).join("")}</optgroup>`).join("")}</select>
    <label for="qd">Difficulty</label><select id="qd"><option value="all">Any</option><option value="0">Beginner</option><option value="1">Intermediate</option></select>
    <label for="qn">Number of questions</label><select id="qn">${[3,5,10,15].map(n=>`<option ${n===(opts.n||5)?"selected":""}>${n}</option>`).join("")}</select>
    <div id="qerr"></div><p><button class="btn" onclick="beginQuiz()">Start quiz</button></p>
    <p class="note">The bank holds ${Q.length} questions, so a quiz may be shorter than requested for narrow filters.</p></div>`;
  }
  if(qs.done)return quizResult();
  const q=qs.items[qs.i],L="ABCD";
  return `<p class="chip">${esc(T[q.t].n)} · ${DIF[q.df]}${KIND[qs.meta.kind]?" · "+KIND[qs.meta.kind]:""}</p><p class="note">Question ${qs.i+1} of ${qs.items.length}${qs.meta.kind==="mastery"?` · ${qs.meta.seen} of ${qs.items.length} appeared in earlier attempts`:""}</p><div class="bar"><i style="width:${100*qs.i/qs.items.length}%"></i></div>
  <h2>${esc(q.q)}</h2>${q.o.map((o,i)=>{let c="opt";if(qs.checked)c+=i===q.a?" ok":i===qs.pick?" no":"";else if(i===qs.pick)c+=" sel";return `<button class="${c}" ${qs.checked?"disabled":""} onclick="pickOpt(${i})"><b>${L[i]}.</b> ${esc(o)}</button>`}).join("")}
  ${qs.checked?`<div class="fb ${qs.pick===q.a?"ok":"no"}"><b>${qs.pick===q.a?"Correct!":"Not quite."}</b> ${esc(q.e)}${qs.pick===q.a?"":`<br>Right answer: <b>${esc(q.o[q.a])}</b>`}</div>
  <button class="btn" onclick="nextQ()">${qs.i+1<qs.items.length?"Next question":"See results"}</button>`:`<button class="btn" ${qs.pick==null?"disabled":""} onclick="checkQ()">Check answer</button>`}`;
}
function beginQuiz(){
  const t=$("#qt").value,d=$("#qd").value,n=+$("#qn").value,items=buildQuiz(t,d,n,opts.prefer);
  if(!items.length){$("#qerr").innerHTML=`<div class="err">No questions match that topic and difficulty. Try “Any” difficulty.</div>`;return}
  qs={items,i:0,pick:null,checked:false,res:[],meta:{t,d}};paint();
}
function pickOpt(i){if(!qs.checked){qs.pick=i;paint()}}
function checkQ(){const q=qs.items[qs.i];qs.checked=true;qs.res.push({id:q.id,t:q.t,ok:qs.pick===q.a,pick:qs.pick});paint()}
function nextQ(){
  if(qs.i+1<qs.items.length){qs.i++;qs.pick=null;qs.checked=false}
  else{qs.done=true;const sc=qs.res.filter(x=>x.ok).length;
    const m=qs.meta,rec={v:2,kind:m.kind||"quiz",id:Date.now(),date:new Date().toISOString(),topic:m.t,diff:m.d,score:sc,total:qs.res.length,
      answers:qs.res.map((x,j)=>{const q=qs.items[j];return{id:x.id,t:x.t,df:q.df,q:q.q,pick:q.o[x.pick],correct:q.o[q.a],ok:x.ok,c:Q[x.id][6]}})};
    if(m.base)rec.base=m.base;
    const bad=badRec(rec);
    if(bad){qs.saved=false;qs.saveErr="This result failed validation ("+bad+") and was not saved."}
    else{const all=raw();all.push(rec);qs.saved=Store.set("attempts",all);if(!qs.saved)qs.saveErr="Your result could not be saved in this browser (storage may be blocked), so it won’t appear in Progress."}}
  paint();
}
function quizResult(){
  const sc=qs.res.filter(x=>x.ok).length,tot=qs.res.length,p=pct(sc,tot);
  return `<h1>${KIND_DONE[qs.meta.kind]||"Quiz complete"}</h1><div class="card"><div class="stat">${sc} / ${tot} (${p}%)</div><p class="mut">${p>=80?"Strong result. Keep revising to stay sharp.":p>=50?"A decent start. Review the explanations below.":"Good practice. Mistakes are where the learning happens."}</p>
  ${qs.saved?"":`<div class="err">${esc(qs.saveErr||"This result was not saved.")}</div>`}</div>
  ${loopNext()}<h2>Review</h2>${qs.items.map((q,i)=>{const r=qs.res[i];return `<div class="card" style="margin:8px 0"><span class="chip">${esc(T[q.t].n)}</span> <b>${r.ok?"✓ Correct":"✗ Missed"}</b><p>${esc(q.q)}</p><p class="note">Your answer: ${esc(q.o[r.pick])}${r.ok?"":" · Correct: "+esc(q.o[q.a])}</p><p class="note">${esc(q.e)}</p></div>`}).join("")}
  <p><button class="btn" onclick="go('quiz')">New quiz</button> <button class="btn alt" onclick="go('coach')">Open Weakness Coach</button></p>`;
}

  return `<div class="card" style="margin:12px 0"><h3>Mastery check: before vs now</h3><p>${line}</p>${qs.saved?`<p>Combined accuracy on this topic is now <b>${pct(now.c,now.t)}%</b> across ${now.t} recorded answers.</p>`:""}
  <p class="note">This is one short quiz of ${tot} question${tot>1?"s":""}${b&&b.t?`, compared with ${b.t} earlier answer${b.t>1?"s":""}`:""}, so the change can easily be down to luck and does not show mastery. ${m.seen} of ${tot} questions had appeared in earlier attempts, which can lift a score through recall rather than understanding. Look for steady results across several quizzes.</p></div>`;
}

/* ---------- Study Planner ---------- */
function vPlanner(){
  const p=Store.get("plan",null);
  const form=`<div class="card" style="margin-top:14px"><label for="pd">Exam date</label><input type="date" id="pd" value="${p?esc(p.date):""}">
  <label for="ph">Study hours per week</label><input type="number" id="ph" min="1" max="40" value="${p?p.hrs:5}">
  <label>Topics you find difficult</label>${Object.keys(T).map(k=>`<label style="font-weight:400;margin:4px 0"><input type="checkbox" class="pk" value="${k}" ${p&&p.hard.includes(k)?"checked":""}> ${T[k].n}</label>`).join("")}
  <div id="perr"></div><button class="btn" style="margin-top:10px" onclick="makePlan()">${p?"Regenerate schedule":"Generate schedule"}</button>${p?`<p class="note">Regenerating replaces your current schedule and its edits.</p>`:""}</div>`;
  if(!p)return `<h1>Study Planner</h1><p class="mut">Tell us when your exam is and we’ll draft a schedule you can edit.</p>${form}`;
  const wks=[...new Set(p.items.map(i=>i.w))];
  return `<h1>Study Planner</h1><p class="mut">${p.wks} week${p.wks>1?"s":""} to go. Edit any task, tick it off, or add your own.</p>
  ${wks.map(w=>`<div class="card" style="margin:10px 0"><h3>Week ${w}</h3>${p.items.map((it,idx)=>it.w!==w?"":`<div class="row"><input type="checkbox" ${it.d?"checked":""} onchange="pEdit(${idx},'d',this.checked)" aria-label="Done"><input type="text" value="${esc(it.t)}" maxlength="140" onchange="pEdit(${idx},'t',this.value)" aria-label="Task"><button class="btn sm alt" onclick="pDel(${idx})" aria-label="Delete">✕</button></div>`).join("")}<button class="btn sm alt" onclick="pAdd(${w})">+ Add task</button></div>`).join("")}
  <h2>Change your inputs</h2>${form}`;
}
function makePlan(){
  const date=$("#pd").value,hrs=+$("#ph").value,hard=[...document.querySelectorAll(".pk:checked")].map(x=>x.value),e=$("#perr");
  const days=Math.ceil((new Date(date+"T00:00:00")-new Date().setHours(0,0,0,0))/864e5);
  if(!date||isNaN(days)){e.innerHTML=`<div class="err">Please choose your exam date.</div>`;return}
  if(days<1){e.innerHTML=`<div class="err">The exam date must be in the future.</div>`;return}
  if(days>365){e.innerHTML=`<div class="err">Please choose a date within the next 12 months.</div>`;return}
  if(!(hrs>=1&&hrs<=40)){e.innerHTML=`<div class="err">Enter study hours between 1 and 40 per week.</div>`;return}
  const wks=Math.min(12,Math.ceil(days/7)),per=Math.min(6,Math.max(2,Math.round(hrs/1.5))),mins=Math.round(hrs*60/per),order=[];
  Object.keys(T).forEach(k=>{order.push(k);if(hard.includes(k))order.push(k)});
  const items=[];let c=0;
  for(let w=1;w<=wks;w++)for(let s=0;s<per;s++){
    if(w===wks&&s===per-1){items.push({w,t:`Mixed practice quiz on all topics, then review every missed question (${mins} min)`,d:false});continue}
    const k=order[c++%order.length];items.push({w,t:`${T[k].n}: read the lesson, then take a short quiz (${mins} min)`,d:false});
  }
  Store.set("plan",{date,hrs,hard,wks,items});paint();
}
function pSave(p){if(!Store.set("plan",p))alert("Couldn’t save your changes in this browser.")}
function pEdit(i,f,v){const p=Store.get("plan");if(!p)return;if(f==="t"){v=v.trim();if(!v){paint();return}}p.items[i][f]=v;pSave(p)}
function pDel(i){const p=Store.get("plan");p.items.splice(i,1);pSave(p);paint()}
function pAdd(w){const p=Store.get("plan");let at=p.items.map(x=>x.w).lastIndexOf(w)+1;p.items.splice(at,0,{w,t:"New task",d:false});pSave(p);paint()}

/* ---------- Progress ---------- */
function vProgress(){
  const A=att(),s=tstats();
  const note=`<div class="card" style="margin-top:14px"><b>Please note:</b> practice performance does not guarantee exam success. These results come from CloudPrep AI’s own questions only and are not a prediction of your official score.</div>`;
  if(!A.length)return `<h1>Progress</h1>${note}<div class="card empty" style="margin-top:14px"><h3>No recorded quizzes yet</h3><p class="mut">Finish a quiz and your history appears here.</p><button class="btn" onclick="go('quiz')">Go to Quiz Lab</button></div>`;
  const last=A.slice(-10);
  return `<h1>Progress</h1>${note}<div class="grid g3" style="margin-top:14px"><div class="card"><div class="stat">${A.length}</div>Quizzes completed</div><div class="card"><div class="stat">${A.reduce((n,a)=>n+a.total,0)}</div>Questions answered</div><div class="card"><div class="stat">${pct(A.reduce((n,a)=>n+a.score,0),A.reduce((n,a)=>n+a.total,0))}%</div>Overall accuracy</div></div>
  <h2>Last ${last.length} score${last.length>1?"s":""} (%)</h2><div class="card"><div class="bars">${last.map(a=>`<div title="${pct(a.score,a.total)}%" style="height:${Math.max(4,pct(a.score,a.total))}%"></div>`).join("")}</div></div>
  <h2>Topic performance</h2>${Object.keys(T).map(k=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>${T[k].n}</span><span class="note">${s[k].t?pct(s[k].c,s[k].t)+"% ("+s[k].c+"/"+s[k].t+")":"No answers yet"}</span></div><div class="bar"><i style="width:${pct(s[k].c,s[k].t)}%"></i></div></div>`).join("")}
  <h2>History</h2><p class="note">Revision practice sessions are listed here but not counted in the scores above.</p>${attAll().slice().reverse().map(a=>`<div class="card" style="margin:8px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span>${new Date(a.date).toLocaleDateString()} · ${a.topic==="all"?"All topics":esc(T[a.topic]?T[a.topic].n:a.topic)}${KIND[a.kind]?" · "+KIND[a.kind]:""}</span><b>${a.score}/${a.total} (${pct(a.score,a.total)}%)</b></div>`).join("")}
  <p><button class="btn sm alt" onclick="if(confirm('Delete all quiz history and your study plan from this browser?')){Store.clear();go('overview')}">Reset my data</button></p>`;
}
render();
</script></body></html>
